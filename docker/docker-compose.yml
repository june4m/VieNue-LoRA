x-base-config: &base-config
  volumes:
    - ./:/workspace
    - huggingface_cache:/root/.cache/huggingface
    - ./output_audio:/workspace/output_audio
    - uv_cache:/root/.cache/uv
    - pip_cache:/root/.cache/pip
  env_file:
    - path: .env
      required: false
  environment:
    - HF_HOME=${HF_HOME:-/root/.cache/huggingface}
    - PYTHONUNBUFFERED=1
  stdin_open: true
  tty: true

services:
  # ========================================================
  # Serve Profile (LMDeploy API Server)
  # ========================================================
  serve:
    profiles: ["serve"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    container_name: vieneu-tts-serve
    ports:
      - "${SERVE_PORT:-23333}:23333"
    environment:
      - HF_HOME=${HF_HOME:-/root/.cache/huggingface}
      - PYTHONUNBUFFERED=1
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${MODEL:-pnnbao-ump/VieNeu-TTS-v2}"
      - "--model-name"
      - "${MODEL_NAME:-pnnbao-ump/VieNeu-TTS-v2}"
      - "--port"
      - "23333"
      - "--memory-util"
      - "${MEMORY_UTIL:-0.3}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ========================================================
  # GPU Profile (Gradio App)
  # ========================================================
  gpu:
    <<: *base-config
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: dev
    container_name: vieneu-tts-gpu-dev
    environment:
      - PORT=${PORT:-7860}
      - GRADIO_SERVER_PORT=${GRADIO_SERVER_PORT:-7860}
      - GRADIO_SERVER_NAME=${GRADIO_SERVER_NAME:-0.0.0.0}
      - GRADIO_SHARE=${GRADIO_SHARE:-0}
      - PHONEMIZER_ESPEAK_LIBRARY=/usr/lib/x86_64-linux-gnu/libespeak-ng.so.1
    ports:
      - "${PORT:-7860}:${GRADIO_SERVER_PORT:-7860}"
    command: ["uv", "run", "apps/gradio_main.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ========================================================
  # TTS API Profile (LearnAble: VieNeu-TTS-0.3B + LoRA)
  #   docker compose -f docker/docker-compose.yml --profile tts-api up -d --build
  # ========================================================
  tts-api:
    profiles: ["tts-api"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: tts-api
    container_name: vieneu-tts-api
    ports:
      - "${TTS_API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VIENEU_LORA=/models/lora
      - VIENEU_CACHE_DIR=/data/tts_cache
    volumes:
      # Codec neuphonic/neucodec là repo gated: giữ cache để không tải lại mỗi lần start.
      - huggingface_cache:/root/.cache/huggingface
      # Thư mục best_adapter (adapter_model.safetensors + voices.json) trên máy host.
      - ${VIENEU_LORA_HOST_DIR:-../models/lora}:/models/lora:ro
      - tts_cache:/data/tts_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s  # lần đầu phải tải backbone + codec
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface_cache:
  uv_cache:
  pip_cache:
  tts_cache: